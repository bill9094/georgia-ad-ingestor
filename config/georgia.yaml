  request_delay_seconds: 0.75
  timeout_seconds: 30
  user_agent: GeorgiaPoliticalAdResearch/1.0
  history_page_size: 100
  services: [tv, cable, dbs]
  target_state: GA
  target_dmas:
    - Atlanta
    - Savannah
    - Augusta
    - Macon
    - Columbus
    - Albany
    - Chattanooga
